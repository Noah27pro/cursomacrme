<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1815" />
      <stop offset="40%" stop-color="#2c1f19" />
      <stop offset="100%" stop-color="#0e0a08" />
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e66737" />
      <stop offset="100%" stop-color="#f1895a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e66737" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="knots" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="none" stroke="#3d2c23" stroke-width="1.2" opacity="0.4" />
      <circle cx="20" cy="20" r="3" fill="#e66737" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#knots)" />
  <circle cx="400" cy="225" r="300" fill="url(#glow)" />

  <!-- Decorative border -->
  <rect x="20" y="20" width="760" height="410" rx="16" fill="none" stroke="#443228" stroke-width="2" />
  <rect x="28" y="28" width="744" height="394" rx="12" fill="none" stroke="#e66737" stroke-width="1" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Badge Top -->
  <g transform="translate(400, 75)">
    <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#e66737" fill-opacity="0.2" stroke="#e66737" stroke-width="1.5" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#fbd5c6" text-anchor="middle" letter-spacing="2">★ EDICIÓN PROFESIONAL ★</text>
  </g>

  <!-- Title -->
  <text x="400" y="165" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    Pulseras de Macramé
  </text>
  <text x="400" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="500" fill="#f1895a" text-anchor="middle" letter-spacing="3">
    DE CERO A EMPRENDEDORA
  </text>

  <!-- Bracelet Visual Centerpiece -->
  <g transform="translate(400, 275)">
    <!-- Bracelet cord lines -->
    <path d="M-220 0 Q-110 -25 0 0 Q110 25 220 0" fill="none" stroke="#d97736" stroke-width="6" stroke-linecap="round" />
    <path d="M-220 -8 Q-110 17 0 -8 Q110 -33 220 -8" fill="none" stroke="#a24c25" stroke-width="4" stroke-linecap="round" />
    
    <!-- Central Stones / Crystals -->
    <circle cx="-60" cy="0" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2" />
    <circle cx="-30" cy="-4" r="12" fill="#e66737" stroke="#fff" stroke-width="2" />
    <circle cx="0" cy="-6" r="16" fill="url(#gold)" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="30" cy="-4" r="12" fill="#e66737" stroke="#fff" stroke-width="2" />
    <circle cx="60" cy="0" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2" />
    
    <!-- Knots representation -->
    <rect x="-140" y="-8" width="18" height="16" rx="4" fill="#8c3f1d" stroke="#f1895a" stroke-width="1" />
    <rect x="-110" y="-8" width="18" height="16" rx="4" fill="#8c3f1d" stroke="#f1895a" stroke-width="1" />
    <rect x="92" y="-8" width="18" height="16" rx="4" fill="#8c3f1d" stroke="#f1895a" stroke-width="1" />
    <rect x="122" y="-8" width="18" height="16" rx="4" fill="#8c3f1d" stroke="#f1895a" stroke-width="1" />
  </g>

  <!-- Hotmart Badge Bottom -->
  <g transform="translate(400, 365)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#ff3c00" />
    <text x="-40" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">🔥 HOTMART</text>
    <line x1="25" y1="-12" x2="25" y2="12" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <text x="95" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PAGO SEGURO ↗</text>
  </g>
</svg>
